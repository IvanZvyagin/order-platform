services:
  order-db:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "5433:5432"
    volumes:
      - order-db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: order_user
      POSTGRES_PASSWORD: order_pass
      POSTGRES_DB: orderdb
    healthcheck:
      test: pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      - backend

  inventory-db:
    image: postgres:16
    container_name: inventory-db
    environment:
      POSTGRES_DB: inventorydb
      POSTGRES_USER: inventory_user
      POSTGRES_PASSWORD: inventory_pass
    ports:
      - "5434:5432"
    volumes:
      - inventory-db-data:/var/lib/postgresql/data
    networks:
      - backend

#  notification-db:
#    image: postgres:16
#    container_name: notification-db
#    environment:
#      POSTGRES_DB: notificationdb
#      POSTGRES_USER: notification_user
#      POSTGRES_PASSWORD: notification_pass
#    ports:
#      - "5435:5432"
#    volumes:
#      - notification-db-data:/var/lib/postgresql/data
#    networks:
#      - backend

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: order-service
    depends_on:
      - order-db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://order-db:5432/orderdb
      SPRING_DATASOURCE_USERNAME: order_user
      SPRING_DATASOURCE_PASSWORD: order_pass
    ports:
      - "8081:8081"
    networks:
      - backend

  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    container_name: inventory-service
    depends_on:
      - inventory-db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://inventory-db:5432/inventorydb
      SPRING_DATASOURCE_USERNAME: inventory_user
      SPRING_DATASOURCE_PASSWORD: inventory_pass
    ports:
      - "8082:8082"
    networks:
      - backend
#  notification-service:
#    build: ./notification-service
#    container_name: notification-service
#    depends_on:
#      - notification-db
#    environment:
#      SPRING_DATASOURCE_URL: jdbc:postgresql://notification-db:5432/notificationdb
#      SPRING_DATASOURCE_USERNAME: notification_user
#      SPRING_DATASOURCE_PASSWORD: notification_pass
#    ports:
#      - "8083:8083"
#    networks:
#      - backend

volumes:
  order-db-data:
  inventory-db-data:
  notification-db-data:

networks:
  backend:
    driver: bridge
