plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.10'          // актуальная стабильная версия
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    // Общая библиотека
    implementation project(':common-libs')

    // Spring WebFlux (реактивный веб)
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    // R2DBC для реактивного доступа к PostgreSQL
    implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
    runtimeOnly 'org.postgresql:r2dbc-postgresql'
    runtimeOnly 'org.postgresql:postgresql' // Для Liquibase

    // Liquibase для миграций (остаётся императивным)
    implementation 'org.liquibase:liquibase-core'

    // Reactor Kafka (реактивный клиент)
    implementation 'io.projectreactor.kafka:reactor-kafka:1.3.23'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Actuator для мониторинга
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}